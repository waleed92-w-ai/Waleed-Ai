<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ وليد التعليمية</title>
    
    <!-- PWA App Profile Icon Settings -->
    <link rel="icon" type="image/jpeg" href="profile.jpg">
    <link rel="apple-touch-icon" href="profile.jpg">
    <meta name="apple-mobile-web-app-title" content="منصة وليد">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #2563eb;
            --accent-color: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .app-title h1 {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .app-title p {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .student-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .student-item:last-child {
            border-bottom: none;
        }

        .student-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .student-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .student-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-pending {
            background: #fef3c7;
            color: #d97706;
        }

        .badge-active {
            background: #d1fae5;
            color: #059669;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
            font-size: 0.9rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
    </style>
</head>
<body>

    <header>
        <div class="teacher-info">
            <img src="profile.jpg" alt="الأستاذ وليد" class="profile-img" onerror="this.src='https://via.placeholder.com/55'">
            <div class="app-title">
                <h1>منصة الأستاذ وليد</h1>
                <p id="userRoleText">واجهة الطالب التعليمية</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="loginBtn" onclick="openLoginModal()" title="تسجيل دخول الأستاذ">
                <i class="fas fa-user-shield"></i>
            </button>
            <button class="btn-icon" id="logoutBtn" onclick="logoutTeacher()" style="display:none;" title="تسجيل الخروج">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <div class="container">
        
        <!-- لوحة التحكم الخاصة بالأستاذ -->
        <div id="teacherPanel" style="display: none;">
            
            <!-- إضافة كورس / ملزمة -->
            <div class="card">
                <div class="section-title">
                    <i class="fas fa-upload"></i> رفع كورس / ملزمة جديدة
                </div>
                <form id="uploadForm" onsubmit="handleUpload(event)">
                    <div class="form-group">
                        <label>نوع المحتوى</label>
                        <select class="form-control" id="contentType">
                            <option value="course">كورس تعليمي</option>
                            <option value="pdf">ملزمة PDF</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>عنوان المحتوى</label>
                        <input type="text" class="form-control" id="contentTitle" required placeholder="مثال: الفصل الأول - شبكات الحاسوب">
                    </div>
                    <div class="form-group">
                        <label>اختيار الملف</label>
                        <input type="file" class="form-control" id="contentFile" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-cloud-upload-alt"></i> نشر المحتوى
                    </button>
                </form>
            </div>

            <!-- إدارة الطلاب والاشتراكات -->
            <div class="card">
                <div class="section-title">
                    <i class="fas fa-users-cog"></i> طلبات الاشتراك والطلاب
                </div>
                <div id="studentsList">
                    <!-- سيتم تحميل قائمة الطلاب هنا -->
                </div>
            </div>

        </div>

        <!-- واجهة الطالب العامة -->
        <div id="studentPanel">
            
            <!-- نموذج طلب الاشتراك للطلاب الجدد -->
            <div class="card" id="subscriptionCard">
                <div class="section-title">
                    <i class="fas fa-user-plus"></i> طلب اشتراك في المنصة
                </div>
                <form id="studentRegisterForm" onsubmit="handleStudentRegister(event)">
                    <div class="form-group">
                        <label>الاسم الثلاثي للطالب</label>
                        <input type="text" class="form-control" id="studentName" required placeholder="أدخل اسمك الكامل">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" class="form-control" id="studentPhone" required placeholder="077XXXXXXXX">
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-paper-plane"></i> إرسال طلب الاشتراك
                    </button>
                </form>
            </div>

            <!-- عرض المحتوى المتاح -->
            <div class="card">
                <div class="section-title">
                    <i class="fas fa-book-open"></i> الكورسات والملازم المتاحة
                </div>
                <div id="publicContent">
                    <p style="text-align: center; color: var(--text-muted); padding: 10px;">لا يوجد محتوى منشور حالياً أو بانتظار تفعيل اشتراكك.</p>
                </div>
            </div>

        </div>

    </div>

    <!-- نافذة تسجيل دخول الأستاذ -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="section-title">
                <i class="fas fa-lock"></i> تسجيل دخول الأستاذ
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" class="form-control" id="teacherPass" placeholder="أدخل رمز الدخول">
            </div>
            <button class="btn btn-primary" onclick="verifyTeacherLogin()">دخول</button>
            <button class="btn btn-danger" onclick="closeLoginModal()" style="margin-top: 10px; background: transparent; color: var(--text-muted);">إلغاء</button>
        </div>
    </div>

    <!-- عنصر الإشعارات -->
    <div class="notification" id="notification"></div>

    <script>
        const ENCRYPTED_PASS = "V0ExOTkyd2E="; 
        let isTeacherLoggedIn = false;

        window.onload = function() {
            renderStudentsList();
            renderContent();
        };

        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('teacherPass').value = '';
        }

        function verifyTeacherLogin() {
            const passInput = document.getElementById('teacherPass').value;
            if (btoa(passInput) === ENCRYPTED_PASS) {
                isTeacherLoggedIn = true;
                document.getElementById('teacherPanel').style.display = 'block';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'flex';
                document.getElementById('userRoleText').innerText = "لوحة إشراف الأستاذ";
                closeLoginModal();
                showNotification('تم تسجيل الدخول بنجاح يا أستاذ وليد');
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function logoutTeacher() {
            isTeacherLoggedIn = false;
            document.getElementById('teacherPanel').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('userRoleText').innerText = "واجهة الطالب التعليمية";
            showNotification('تم تسجيل الخروج والعودة للوضع العام');
        }

        function handleStudentRegister(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;

            const student = {
                id: Date.now(),
                name: name,
                phone: phone,
                status: 'pending'
            };

            let students = JSON.parse(localStorage.getItem('waleed_students')) || [];
            students.push(student);
            localStorage.setItem('waleed_students', JSON.stringify(students));
            localStorage.setItem('current_student_id', student.id);

            document.getElementById('studentRegisterForm').reset();
            showNotification('تم إرسال طلب اشتراكك بنجاح! بانتظار تفعيل الأستاذ.');
            renderStudentsList();
        }

        function renderStudentsList() {
            const container = document.getElementById('studentsList');
            let students = JSON.parse(localStorage.getItem('waleed_students')) || [];

            if (students.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 10px;">لا يوجد طلبات اشتراك حالياً.</p>`;
                return;
            }

            let html = '';
            students.forEach(student => {
                html += `
                    <div class="student-item">
                        <div class="student-info">
                            <h4>${student.name}</h4>
                            <p>${student.phone} - <span class="badge ${student.status === 'active' ? 'badge-active' : 'badge-pending'}">${student.status === 'active' ? 'مُفعل' : 'بانتظار التفعيل'}</span></p>
                        </div>
                        <div class="student-actions">
                            ${student.status === 'pending' ? 
                                `<button class="btn btn-sm btn-success" onclick="toggleStudentStatus(${student.id}, 'active')">تفعيل</button>` : 
                                `<button class="btn btn-sm btn-danger" onclick="kickAndRemoveStudent(${student.id})">طرد وإلغاء</button>`
                            }
                            ${student.status === 'pending' ? `<button class="btn btn-sm btn-danger" onclick="kickAndRemoveStudent(${student.id})">رفض والطرد</button>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function toggleStudentStatus(studentId, newStatus) {
            let students = JSON.parse(localStorage.getItem('waleed_students')) || [];
            students = students.map(s => {
                if (s.id === studentId) s.status = newStatus;
                return s;
            });
            localStorage.setItem('waleed_students', JSON.stringify(students));
            renderStudentsList();
            showNotification('تم تحديث حالة اشتراك الطالب');
        }

        function kickAndRemoveStudent(studentId) {
            if (confirm('هل أنت تأكد من طرد هذا الطالب وإلغاء اشتراكه تماماً؟')) {
                let students = JSON.parse(localStorage.getItem('waleed_students')) || [];
                students = students.filter(s => s.id !== studentId);
                localStorage.setItem('waleed_students', JSON.stringify(students));

                const currentStudentId = localStorage.getItem('current_student_id');
                if (currentStudentId == studentId) {
                    localStorage.removeItem('current_student_id');
                }

                renderStudentsList();
                showNotification('تم طرد الطالب وإلغاء اشتراكه بنجاح، ويمكنه التقديم مجدداً.');
            }
        }

        function handleUpload(e) {
            e.preventDefault();
            const type = document.getElementById('contentType').value;
            const title = document.getElementById('contentTitle').value;
            const fileInput = document.getElementById('contentFile');

            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const item = {
                id: Date.now(),
                type: type,
                title: title,
                fileName: file.name,
                date: new Date().toLocaleDateString('ar-EG')
            };

            let contents = JSON.parse(localStorage.getItem('waleed_contents')) || [];
            contents.push(item);
            localStorage.setItem('waleed_contents', JSON.stringify(contents));

            document.getElementById('uploadForm').reset();
            showNotification('تم رفع المحتوى بنجاح!');
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('publicContent');
            let contents = JSON.parse(localStorage.getItem('waleed_contents')) || [];

            if (contents.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 10px;">لا يوجد محتوى منشور حالياً.</p>`;
                return;
            }

            let html = '';
            contents.forEach(item => {
                html += `
                    <div class="student-item">
                        <div class="student-info">
                            <h4><i class="${item.type === 'pdf' ? 'fas fa-file-pdf' : 'fas fa-video'}" style="color:var(--secondary-color)"></i> ${item.title}</h4>
                            <p>${item.fileName} - ${item.date}</p>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-primary" onclick="alert('جاري تحميل الملف: ${item.fileName}')">عرض / تحميل</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.innerText = msg;
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
