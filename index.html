<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ وليد الشمري التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#1d4ed8',
                            800: '#1e3a8a',
                            900: '#0f172a'
                        },
                        iraq: {
                            gold: '#d97706',
                            green: '#16a34a',
                            red: '#dc2626'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-cairo text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- رأس الصفحة وواجهة المنصة -->
    <header class="bg-brand-900 text-white shadow-md py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">منصة الأستاذ وليد الشمري التعليمية</h1>
            <span class="bg-iraq-green text-white text-xs px-3 py-1 rounded-full font-semibold">معتمد</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-4xl mx-auto p-6 flex-grow w-full">
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-gray-100">
            <h2 class="text-lg font-bold text-brand-800 mb-4">تفعيل الاشتراك</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسم الطالب:</label>
                    <input type="text" id="student-name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="أدخل اسم الطالب الثلاثي">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">رقم الهاتف:</label>
                    <input type="text" id="student-phone" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="رقم الهاتف للتواصل">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">رقم الوصل / العملية:</label>
                    <input type="text" id="receipt-number" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="أدخل رقم الوصل أو التحويل">
                </div>
                
                <button onclick="sendPaymentNotification()" class="w-full bg-iraq-green text-white py-3 rounded-lg font-bold hover:bg-green-700 transition duration-200 shadow">
                    تفعيل الاشتراك (5,000 د.ع / شهر)
                </button>
            </div>
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-800 text-gray-300 text-center py-4 text-sm">
        جميع الحقوق محفوظة © لمنصة الحاسوب والصيانة الرقمية الشاملة
    </footer>

    <!-- البرمجة والدوال الأساسية (مغلقة بإحكام داخل وسوم السكريبت) -->
    <script>
        // دالة إشعار الدفع والتحويل للواتساب
        function sendPaymentNotification() {
            const studentName = document.getElementById('student-name') ? document.getElementById('student-name').value : '';
            const studentPhone = document.getElementById('student-phone') ? document.getElementById('student-phone').value : '';
            const receiptNumber = document.getElementById('receipt-number') ? document.getElementById('receipt-number').value : '';
            
            if (!studentName || !receiptNumber) {
                alert('يرجى كتابة اسم الطالب ورقم الوصل/العملية.');
                return;
            }
            
            const myWhatsAppNumber = '9647816745861';
            const message = `مرحباً أستاذ وليد، أود تفعيل اشتراكي في المنصة.\n\n👤 اسم الطالب: ${studentName}\n📱 رقم الهاتف: ${studentPhone}\n📄 رقم الوصل / العملية: ${receiptNumber}\n\nيرجى تفعيل الحساب وشكراً جزيلاً!`;
            const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // دالة إلغاء تفعيل الطالب وطرد حسابه من المنصة
        function revokeSubscription(studentPhone) {
            if (confirm('هل أنت متأكد من رغبتك في إلغاء تفعيل هذا الطالب وطرد حسابه من المنصة؟')) {
                let activeUsers = JSON.parse(localStorage.getItem('activeUsers') || '[]');
                activeUsers = activeUsers.filter(user => user.phone !== studentPhone);
                localStorage.setItem('activeUsers', JSON.stringify(activeUsers));

                if (localStorage.getItem('studentPhone') === studentPhone) {
                    localStorage.removeItem('isSubscribed');
                    localStorage.removeItem('studentName');
                    localStorage.removeItem('studentPhone');
                }

                alert('تم إلغاء تفعيل الطالب وحذفه بنجاح!');
                location.reload();
            }
        }
    </script>
</body>
</html>
