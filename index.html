<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ وليد الشمري التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col justify-between select-none">

    <!-- رأس الصفحة -->
    <header class="bg-slate-900 text-white shadow-md py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-bold">منصة الأستاذ وليد الشمري</h1>
            <div class="flex items-center gap-2">
                <span id="header-badge" class="bg-green-600 text-white text-xs px-3 py-1 rounded-full font-semibold">محمي ومؤمن</span>
                <button onclick="toggleAdminLogin()" class="bg-amber-500 text-black text-xs px-3 py-1.5 rounded-lg font-bold shadow">🔑 دخول الأستاذ</button>
            </div>
        </div>
    </header>

    <!-- شريط الإشعار -->
    <div id="status-bar" class="bg-amber-500 text-black text-center py-3 px-4 font-bold text-sm shadow-sm">
        المنصة محمية: اختر طريقة الدفع وأرسل بياناتك للتفعيل وعرض المحاضرات!
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-4xl mx-auto p-6 flex-grow w-full space-y-6">
        
        <!-- نافذة إدخال الرمز السري للأستاذ (تفتح عند الضغط على زر دخول الأستاذ) -->
        <div id="admin-login-box" class="hidden bg-slate-900 text-white rounded-2xl shadow-lg p-6 border-2 border-amber-500 space-y-3">
            <h2 class="text-lg font-bold text-amber-400">🔐 تسجيل دخول الأستاذ وليد</h2>
            <p class="text-xs text-gray-300">أدخل الرمز السري الخاص بك (`WA1992wa`) لإظهار المنصة بالكامل:</p>
            <div class="flex gap-2">
                <input type="password" id="admin-code-input" class="w-full px-4 py-2 rounded-lg text-black focus:outline-none" placeholder="أدخل الرمز السري...">
                <button onclick="checkAdminCode()" class="bg-amber-500 text-black px-6 py-2 rounded-lg font-bold">دخول</button>
            </div>
        </div>

        <!-- لوحة تحكم الأستاذ بعد تسجيل الدخول -->
        <div id="admin-dashboard" class="hidden bg-emerald-50 border-2 border-emerald-600 rounded-2xl shadow-lg p-4 flex justify-between items-center">
            <span class="text-sm font-bold text-emerald-900">👨‍🏫 مرحباً بك أستاذ وليد - المنصة بكامل أقسامها ظاهرة لك الآن</span>
            <button onclick="logoutAdmin()" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">تسجيل الخروج</button>
        </div>
